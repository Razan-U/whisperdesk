name: Windows tests

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run test suite
        run: python -m pytest -q
