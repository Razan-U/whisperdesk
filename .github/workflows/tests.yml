name: Windows verification

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run full test suite
        run: python -m pytest -q

      - name: Resolve package version
        shell: pwsh
        run: |
          $version = (python -c "import whisperdesk; print(whisperdesk.__version__)").Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          $core = ($version -split '-')[0]
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION4=$core.0" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Assemble Windows payload
        shell: pwsh
        run: |
          $build = Join-Path (Split-Path $PWD -Parent) "windows-build"
          New-Item -ItemType Directory -Force -Path "$build/downloads", "$build/wheels" | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -OutFile "$build/downloads/python.zip"
          Invoke-WebRequest "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile "$build/downloads/vc_redist.x64.exe"
          python -m pip download --only-binary=:all: --dest "$build/wheels" -r requirements.txt colorama==0.4.6
          python installer/assemble.py "$build"

      - name: Compile test installers
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $env:Path += ";C:\Program Files (x86)\NSIS;C:\Program Files\NSIS"
          $makensis = (Get-Command makensis.exe -ErrorAction Stop).Source
          Push-Location "installer"
          & $makensis "launcher.nsi"
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed" }
          & $makensis "/DVERSION=$env:VERSION" "/DVERSION4=$env:VERSION4" "update.nsi"
          if ($LASTEXITCODE -ne 0) { throw "Updater build failed" }
          & $makensis "/DVERSION=$env:VERSION" "/DVERSION4=$env:VERSION4" "setup.nsi"
          if ($LASTEXITCODE -ne 0) { throw "Setup build failed" }
          Pop-Location

      - name: Verify build outputs
        shell: pwsh
        run: |
          $parent = Split-Path $PWD -Parent
          $files = @(
            (Join-Path $parent "WhisperDesk-Update-$env:VERSION.exe"),
            (Join-Path $parent "WhisperDesk-Setup-$env:VERSION.exe"),
            (Join-Path $parent "windows-build/payload/WhisperDesk.exe")
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing build output: $file" }
            if ((Get-Item $file).Length -le 0) { throw "Empty build output: $file" }
          }
          New-Item -ItemType Directory -Force -Path "test-build" | Out-Null
          Copy-Item $files[0] "test-build/"
          Copy-Item $files[1] "test-build/"

      - uses: actions/upload-artifact@v4
        with:
          name: WhisperDesk-${{ env.VERSION }}-test-build
          path: test-build/*
          if-no-files-found: error
