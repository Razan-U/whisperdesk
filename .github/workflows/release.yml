name: Build Windows release

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve and validate version
        shell: pwsh
        run: |
          $prefix = "release/v"
          $ref = "${{ github.ref_name }}"
          if (-not $ref.StartsWith($prefix)) { throw "Unexpected release branch: $ref" }
          $version = $ref.Substring($prefix.Length)
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          $core = ($version -split '-')[0]
          $version4 = "$core.0"
          $init = Get-Content "whisperdesk/__init__.py" -Raw
          if ($init -notmatch ('__version__\s*=\s*["'']' + [regex]::Escape($version) + '["'']')) {
            throw "whisperdesk.__version__ does not match release branch $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION4=$version4" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Prepare embedded runtime inputs
        shell: pwsh
        run: |
          $build = Join-Path (Split-Path $PWD -Parent) "windows-build"
          New-Item -ItemType Directory -Force -Path "$build/downloads", "$build/wheels" | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -OutFile "$build/downloads/python.zip"
          Invoke-WebRequest "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile "$build/downloads/vc_redist.x64.exe"
          python -m pip download --only-binary=:all: --dest "$build/wheels" -r requirements.txt colorama==0.4.6
          python installer/assemble.py "$build"

      - name: Compile NSIS executables
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $env:Path += ";C:\Program Files (x86)\NSIS;C:\Program Files\NSIS"
          $makensis = (Get-Command makensis.exe -ErrorAction Stop).Source
          & $makensis "installer/launcher.nsi"
          & $makensis "/DVERSION=$env:VERSION" "/DVERSION4=$env:VERSION4" "installer/update.nsi"
          & $makensis "/DVERSION=$env:VERSION" "/DVERSION4=$env:VERSION4" "installer/setup.nsi"

      - name: Verify and stage release assets
        shell: pwsh
        run: |
          $parent = Split-Path $PWD -Parent
          $release = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          $files = @(
            "WhisperDesk-Update-$env:VERSION.exe",
            "WhisperDesk-Setup-$env:VERSION.exe"
          )
          foreach ($name in $files) {
            $source = Join-Path $parent $name
            if (-not (Test-Path $source)) { throw "Missing release asset: $source" }
            Copy-Item $source (Join-Path $release $name)
            $hash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -Encoding ascii -NoNewline (Join-Path $release "$name.sha256")
          }

      - uses: actions/upload-artifact@v4
        with:
          name: WhisperDesk-${{ env.VERSION }}-windows
          path: release-assets/*
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          $args = @(
            "release", "create", $tag,
            "release-assets/WhisperDesk-Update-$env:VERSION.exe",
            "release-assets/WhisperDesk-Update-$env:VERSION.exe.sha256",
            "release-assets/WhisperDesk-Setup-$env:VERSION.exe",
            "release-assets/WhisperDesk-Setup-$env:VERSION.exe.sha256",
            "--target", "${{ github.sha }}",
            "--title", "WhisperDesk $env:VERSION",
            "--generate-notes"
          )
          if ($env:VERSION.Contains("-")) { $args += "--prerelease" }
          & gh @args
